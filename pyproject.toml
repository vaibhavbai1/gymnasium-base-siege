[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gymnasium-base-siege"
version = "0.1.0rc1"
description = "Base Siege: a masked-action strategy environment for Gymnasium"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [
  {name = "Vaibhav Bairathi"},
]
dependencies = ["gymnasium>=1.3,<1.5", "numpy>=2.5.2,<2.6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
render = ["matplotlib>=3.11,<3.12"]
dev = ["pytest>=9,<10", "build>=1,<2", "twine>=6,<8"]

[project.urls]
Repository = "https://github.com/vaibhavbai1/gymnasium-base-siege"
Issues = "https://github.com/vaibhavbai1/gymnasium-base-siege/issues"
"Original capstone" = "https://github.com/Reinforcement-Learning-UTS/base-siege-dihedrals"
"Interactive demo" = "https://base-siege-dihedrals.streamlit.app/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
